services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fillwise
      POSTGRES_PASSWORD: fillwise
      POSTGRES_DB: fillwise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fillwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgres://fillwise:fillwise@postgres:5432/fillwise?sslmode=disable
      REDIS_URL: redis://redis:6379
      SNAPSHOT_PATH: /data/sydney_snapshot.json
      PORT: "8080"
      HOST: 0.0.0.0
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
    depends_on:
      - api
    ports:
      - "8088:80"

volumes:
  pgdata:
